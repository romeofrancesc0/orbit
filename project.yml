# Project definition: `xcodegen generate` produces PoweredNotch.xcodeproj.
# Xcode (not just SwiftPM) is required for App Intents: Shortcuts, Spotlight and
# Focus filters need metadata that only its build system generates.
name: PoweredNotch
options:
  bundleIdPrefix: com.francescoromeo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: it
packages:
  # Automatic updates: the app reads appcast.xml from the latest GitHub release (scripts/release.sh).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    # build.sh applies the signature, picking whichever identity is available.
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
targets:
  PoweredNotch:
    type: application
    platform: macOS
    sources:
      - path: Sources/PoweredNotch
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: Resources/Localization
        buildPhase: resources
      - path: extensions/claude-code-hooks/powered_notch_hook.py
        buildPhase: resources
    dependencies:
      - package: Sparkle
      # Only copied into the bundle: /usr/bin/perl loads it, the app must not link against it.
      - target: PoweredNotchMediaBridge
        link: false
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_NAME: PoweredNotch
        PRODUCT_BUNDLE_IDENTIFIER: com.francescoromeo.powerednotch
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: "NO"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Powered Notch
        CFBundleDisplayName: Powered Notch
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations: [it, en, es, fr, de]
        # Lives in the notch: no Dock icon, except while the settings window is open.
        LSUIElement: true
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright © 2026 Francesco Romeo. MIT License.
        NSCalendarsFullAccessUsageDescription: Powered Notch mostra i tuoi prossimi eventi nella notch. I dati restano sul Mac.
        NSRemindersFullAccessUsageDescription: Powered Notch mostra i tuoi promemoria nella notch. I dati restano sul Mac.
        NSCameraUsageDescription: Lo specchio di Powered Notch usa la fotocamera per mostrarti come appari. Non registra nulla.
        NSBluetoothAlwaysUsageDescription: Powered Notch ti avvisa nella notch quando un dispositivo Bluetooth si collega o si scollega.
        # Sparkle: where to look for updates, the key that signs them, a check a day.
        SUFeedURL: https://github.com/romeofrancesc0/powered-notch/releases/latest/download/appcast.xml
        SUPublicEDKey: Zq4anDZxeLRzGdLyvCrB0bGHOGnm+z9S0nUYbcklimU=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        CFBundleURLTypes:
          - CFBundleURLName: com.francescoromeo.powerednotch
            CFBundleURLSchemes:
              - powerednotch
  PoweredNotchMediaBridge:
    type: library.dynamic
    platform: macOS
    sources:
      - path: Sources/PoweredNotchMediaBridge
    settings:
      base:
        PRODUCT_NAME: PoweredNotchMediaBridge
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: "YES"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: "YES"
