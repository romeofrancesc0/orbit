# Definizione del progetto: `xcodegen generate` produce Lunetta.xcodeproj.
# Serve Xcode (e non solo SwiftPM) per le App Intents: Comandi rapidi, Spotlight
# e filtri Full Immersion richiedono i metadati che genera solo il suo build system.
name: Lunetta
options:
  bundleIdPrefix: com.francescoromeo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    # La firma la applica build.sh, che sceglie l'identità disponibile.
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
targets:
  Lunetta:
    type: application
    platform: macOS
    sources:
      - path: Sources/Lunetta
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: extensions/claude-code-hooks/lunetta_hook.py
        buildPhase: resources
    dependencies:
      # Solo copiata nel bundle: la carica /usr/bin/perl, l'app non deve collegarsi a lei.
      - target: LunettaMediaBridge
        link: false
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_NAME: Lunetta
        PRODUCT_BUNDLE_IDENTIFIER: com.francescoromeo.lunetta
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: "NO"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Lunetta
        CFBundleDisplayName: Lunetta
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        # Vive nella notch: niente Dock, tranne quando è aperta la finestra delle impostazioni.
        LSUIElement: true
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Francesco Romeo
        NSCalendarsFullAccessUsageDescription: Lunetta mostra i tuoi prossimi eventi nella notch. I dati restano sul Mac.
        NSRemindersFullAccessUsageDescription: Lunetta mostra i tuoi promemoria nella notch. I dati restano sul Mac.
        NSCameraUsageDescription: Lo specchio di Lunetta usa la fotocamera per mostrarti come appari. Non registra nulla.
        NSBluetoothAlwaysUsageDescription: Lunetta ti avvisa nella notch quando un dispositivo Bluetooth si collega o si scollega.
        CFBundleURLTypes:
          - CFBundleURLName: com.francescoromeo.lunetta
            CFBundleURLSchemes:
              - lunetta
  LunettaMediaBridge:
    type: library.dynamic
    platform: macOS
    sources:
      - path: Sources/LunettaMediaBridge
    settings:
      base:
        PRODUCT_NAME: LunettaMediaBridge
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: "YES"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: "YES"
